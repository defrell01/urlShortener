version: '3.8'

services:
  redis:
    container_name: redis
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - postgres_network

  postgres_master:
    container_name: postgres_master
    image: postgres:16.4
    user: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - postgres_network
    command: >
      bash -c "echo 'host replication postgres 0.0.0.0/0 trust' >> /var/lib/postgresql/data/pg_hba.conf &&
      echo 'wal_level = replica' >> /var/lib/postgresql/data/postgresql.conf &&
      echo 'max_wal_senders = 10' >> /var/lib/postgresql/data/postgresql.conf &&
      echo 'hot_standby = on' >> /var/lib/postgresql/data/postgresql.conf &&
      exec postgres"

  postgres_replica:
    container_name: postgres_replica
    image: postgres:16.4
    user: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data
    depends_on:
      - postgres_master
    networks:
      - postgres_network
    restart: always
    command: >
      bash -c "
      rm -rf /var/lib/postgresql/data/* &&
      chmod 750 /var/lib/postgresql/data &&
      pg_basebackup -h postgres_master -D /var/lib/postgresql/data -U postgres -Fp -Xs -P -R &&
      exec postgres"

networks:
  postgres_network: